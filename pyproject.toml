[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kalshi-auto-trader"
version = "0.1.0"
description = "Risk-first Python/C++ execution framework for Kalshi event contracts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shawn Son" }]
dependencies = [
  "cryptography>=42.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
kalshi-trader = "kalshi_trader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_trader"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["kalshi_trader"]
