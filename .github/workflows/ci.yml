name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/cpp --config Release
      - run: ./build/cpp/kalshi_fastcore_bench
