[runtime]
environment = "paper"
poll_interval_seconds = 5.0
database_path = "data/trader.db"
signal_path = "signals/example.csv"
log_level = "INFO"
allow_live = false
cancel_open_orders_on_shutdown = true

[universe]
# Replace with liquid tickers you have researched. Empty means the example
# signal file determines the universe.
tickers = []

[strategy]
min_edge_bps = 500
min_probability = 0.02
max_probability = 0.98
max_signal_age_seconds = 300
price_improvement_cents = 1
# taker crosses the spread (fills now, pays taker fee); maker rests inside the
# spread with post_only (fills later or never, pays maker fee).
order_style = "taker"
# Sell a held position once the best bid exceeds fair value by this much.
exit_edge_bps = 200

[risk]
max_contracts_per_order = 5
max_order_notional_cents = 250
max_market_exposure_cents = 1000
max_total_exposure_cents = 2500
max_daily_loss_cents = 500
max_open_orders = 10
max_spread_cents = 8
min_top_level_contracts = 2
min_balance_cents = 1000
cooldown_seconds = 30

[paper]
starting_balance_cents = 10000
slippage_cents = 1

[fees]
# Kalshi: fee = ceil(rate * contracts * price * (1 - price)), per order.
# 0.07 is the standard taker rate. Some series charge makers; check the
# published schedule for each series you trade.
taker_rate = 0.07
maker_rate = 0.0

[collector]
# Research data lives apart from the trading journal.
database_path = "data/history.db"
# Series to snapshot every cycle, e.g. ["KXHIGHNY", "KXCPI"]. Tickers in
# [universe] and the signal file are always included.
series = []
interval_seconds = 60.0
orderbook_depth = 5
max_markets = 200
concurrency = 4

[model]
# `kalshi-trader signal` scores these series (plus [universe] tickers) and
# writes runtime.signal_path. Weights blend members in log-odds space.
series = []
# Structural: exclusivity + monotone-ladder consistency of the book itself.
structural_weight = 1.0
# External: a CSV of probabilities or decimal odds from a source you trust
# (forecast distribution, bookmaker line, consensus). 0 disables it.
external_weight = 0.0
# external_input = "signals/external.csv"
# How much to trust the external source versus the market mid (1 = fully).
shrink_to_source = 0.7
# Extra weight on the market mid in the final blend (shrinkage prior).
market_weight = 0.0
# Platt parameters from `kalshi-trader evaluate --fit-calibration`.
# calibration_path = "data/calibration.json"
orderbook_depth = 1
max_markets = 200

[sizing]
# Fraction of full Kelly to stake. Full Kelly assumes the model is exactly
# right; a quarter is a common compromise between growth and drawdown.
kelly_fraction = 0.25
# Hard cap on one market as a fraction of bankroll, whatever Kelly says.
max_bankroll_fraction = 0.05
# Skip edges whose expected return, annualized over time to close, is below
# this. 0 disables the hurdle. 0.5 means "at least 50% per year".
min_annualized_return = 0.0
# Used when a market has no close time.
default_days_to_resolution = 7.0
