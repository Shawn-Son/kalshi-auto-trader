[runtime]
environment = "live"
poll_interval_seconds = 1.0
database_path = "data/live-trader.db"
signal_path = "signals/live.csv"
log_level = "INFO"
# All three interlocks are required: this flag, --confirm-live, and the
# KALSHI_LIVE_CONFIRM environment variable.
allow_live = false
cancel_open_orders_on_shutdown = true

[universe]
tickers = []

[strategy]
min_edge_bps = 800
min_probability = 0.02
max_probability = 0.98
max_signal_age_seconds = 60
price_improvement_cents = 0

[risk]
max_contracts_per_order = 1
max_order_notional_cents = 75
max_market_exposure_cents = 200
max_total_exposure_cents = 500
max_daily_loss_cents = 100
max_open_orders = 3
max_spread_cents = 5
min_top_level_contracts = 5
min_balance_cents = 1000
cooldown_seconds = 60

[paper]
starting_balance_cents = 10000
slippage_cents = 1

[fees]
# Kalshi: fee = ceil(rate * contracts * price * (1 - price)), per order.
# 0.07 is the standard taker rate. Some series charge makers; check the
# published schedule for each series you trade.
taker_rate = 0.07
maker_rate = 0.0
